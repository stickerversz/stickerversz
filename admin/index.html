<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickerVersz Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- Sidebar overlay (mobile) -->
  <div id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">✦</div>
        <span class="logo-text">StickerVersz</span>
      </div>
      <button class="sidebar-close" id="sidebarCloseBtn" aria-label="Close" onclick="closeSidebar()">✕</button>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="products">
        <span class="nav-icon">🏷️</span>
        <span class="nav-label">Products</span>
        <span class="nav-badge" id="navBadgeProducts"></span>
      </a>
      <a href="#" class="nav-item" data-page="categories">
        <span class="nav-icon">📁</span>
        <span class="nav-label">Categories</span>
      </a>
      <a href="#" class="nav-item" data-page="orders">
        <span class="nav-icon">📦</span>
        <span class="nav-label">Orders</span>
        <span class="nav-badge" id="navBadgeOrders"></span>
      </a>
      <a href="#" class="nav-item" data-page="inventory">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Inventory</span>
      </a>
      <a href="#" class="nav-item" data-page="delivery">
        <span class="nav-icon">🚚</span>
        <span class="nav-label">Delivery</span>
      </a>
      <a href="#" class="nav-item" data-page="content">
        <span class="nav-icon">📝</span>
        <span class="nav-label">Website Content</span>
      </a>
      <a href="#" class="nav-item" data-page="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="/" target="_blank" class="nav-item">
        <span class="nav-icon">🌐</span>
        <span class="nav-label">View Store</span>
      </a>
      <button class="nav-item nav-item-btn" id="logoutBtn">
        <span class="nav-icon">🚪</span>
        <span class="nav-label">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main wrapper -->
  <div class="main-wrapper">
    <!-- Topbar -->
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Open menu">☰</button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
        <div class="user-chip">
          <div class="user-avatar" id="userAvatar">A</div>
          <span class="user-name" id="userName">Admin</span>
        </div>
      </div>
    </header>

    <!-- Dynamic page content -->
    <main class="page-content" id="pageContent">
      <div class="loading-spinner"></div>
    </main>
  </div>

  <!-- Modal overlay -->
  <div id="modalOverlay" hidden>
    <div id="modal" class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close-btn" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer"></div>

  <script src="admin.js"></script>
</body>
</html>
